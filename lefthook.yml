glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      run: pnpm oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm oxlint --fix {staged_files}
      stage_fixed: true

    - name: cspell
      glob:
        - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
        - '**/*.{md,mdx}'
        - '**/*.{json,jsonc,yaml,yml}'
        - '**/*.css'
        - '**/.gitignore'
      run: pnpm cspell lint --no-progress --file {staged_files}
