services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nelsonlaidev_test
    ports:
      - 5433:5432
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nelsonlaidev_test']
      interval: 2s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:8.10.2
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  uprest-test:
    image: ghcr.io/nelsonlaidev/uprest:v0.4.0
    ports:
      - 18079:8080
    environment:
      UPREST_TOKEN: test-only-uprest-token
      UPREST_CONNECTION_STRING: redis://redis-test:6379
    depends_on:
      redis-test:
        condition: service_healthy
