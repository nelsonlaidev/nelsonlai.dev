services:
  db:
    image: postgres:16-alpine
    container_name: nelsonlaidev-postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nelsonlaidev
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - nelsonlaidev-network
  redis:
    image: redis
    container_name: nelsonlaidev-redis
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    networks:
      - nelsonlaidev-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  uprest:
    image: ghcr.io/nelsonlaidev/uprest:v0.1.0
    container_name: nelsonlaidev-uprest
    ports:
      - 8079:8080
    environment:
      UPREST_TOKEN: nelsonlaidev
      UPREST_CONNECTION_STRING: redis://redis:6379
    networks:
      - nelsonlaidev-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db:
  redis:

networks:
  nelsonlaidev-network:
    driver: bridge
