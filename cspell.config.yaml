$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json

version: '0.2'
language: en
useGitignore: true
enableGlobDot: true

import:
  - '@cspell/dict-es-es/cspell-ext.json'
  - '@cspell/dict-pt-br/cspell-ext.json'

ignorePaths:
  - pnpm-lock.yaml

files:
  - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
  - '**/*.{md,mdx}'
  - '**/*.{json,jsonc,yaml,yml}'
  - '**/*.css'
  - '**/.gitignore'

overrides:
  - filename:
      - 'apps/web/messages/es.json'
      - 'apps/web/content/**/es/*.mdx'
    language: en,es
    dictionaries:
      - es-custom
  - filename:
      - 'apps/web/messages/pt-BR.json'
      - 'apps/web/content/**/pt-BR/*.mdx'
    language: en,pt-br
    dictionaries:
      - pt-br-custom

dictionaryDefinitions:
  - name: en-custom
    path: ./.cspell/en-custom.txt
  - name: es-custom
    path: ./.cspell/es-custom.txt
  - name: pt-br-custom
    path: ./.cspell/pt-br-custom.txt
  - name: names
    path: ./.cspell/names.txt
  - name: tech-terms
    path: ./.cspell/tech-terms.txt

dictionaries:
  - en-custom
  - names
  - tech-terms
  - npm
  - python
  - rust-crates
