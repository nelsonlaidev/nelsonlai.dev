services:
  postgres:
    image: postgres:18-alpine
    container_name: nelsonlaidev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nelsonlaidev
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.10.2
    container_name: nelsonlaidev-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  uprest:
    image: ghcr.io/nelsonlaidev/uprest:v0.4.0
    container_name: nelsonlaidev-uprest
    ports:
      - 8079:8080
    environment:
      UPREST_TOKEN: local-uprest-token-7f3c9a2e6b1d4f80
      UPREST_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
