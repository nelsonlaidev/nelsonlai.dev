name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build-time validation uses local, disposable service addresses and test-only values.
# Test runners apply the dedicated configuration in apps/web/src/tests/env.ts.
env:
  SITE_URL: http://localhost:3100
  BETTER_AUTH_URL: http://localhost:3100
  DATABASE_URL: postgres://postgres:postgres@localhost:5433/nelsonlaidev_test
  UPSTASH_REDIS_REST_URL: http://localhost:18079
  UPSTASH_REDIS_REST_TOKEN: test-only-uprest-token
  IP_ADDRESS_SALT: test-only-ip-address-salt-at-least-32-characters
  BETTER_AUTH_SECRET: test-only-better-auth-secret-at-least-32-characters
  JWT_SECRET: test-only-jwt-secret-at-least-32-characters
  RESEND_FROM_EMAIL: Test <noreply@example.invalid>

jobs:
  checks:
    name: Build, checks, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      # A fresh checkout needs generated content, messages, and environment types.
      - name: Build workspace
        run: pnpm build

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check spelling
        run: pnpm spellcheck

      - name: Check types
        run: pnpm typecheck

      - name: Check unused code and dependencies
        run: pnpm knip

      - name: Check translations
        run: pnpm i18n:check

      - name: Run unit tests
        run: pnpm test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build MDX plugins
        run: pnpm --filter @repo/mdx-plugins build

      - name: Install Chromium and system dependencies
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      # This starts isolated services, prepares their schema, and builds the test server.
      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yaml -p nelsonlai-tests down
