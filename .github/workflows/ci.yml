name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: http://localhost:3000
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/nelsonlaidev
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: local-uprest-token-7f3c9a2e6b1d4f80
  IP_ADDRESS_SALT: test-only-ip-address-salt-at-least-32-characters
  BETTER_AUTH_SECRET: test-only-better-auth-secret-at-least-32-characters
  JWT_SECRET: test-only-jwt-secret-at-least-32-characters
  RESEND_FROM_EMAIL: Test <noreply@example.invalid>

jobs:
  checks:
    name: Build, checks, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build workspace
        run: pnpm build

      - parallel:
          - name: Check formatting
            run: pnpm format:check

          - name: Check spelling
            run: pnpm spellcheck

          - name: Check translations
            run: pnpm i18n:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Check unused code and dependencies
        run: pnpm knip

      - name: Run unit tests
        run: pnpm test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build workspace
        run: pnpm build

      - parallel:
          - name: Install Chromium and system dependencies
            run: pnpm --filter @repo/web exec playwright install --with-deps chromium

          - name: Start services
            run: docker compose up -d --wait

      - name: Run database migrations
        run: pnpm --filter @repo/db db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30
