name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
  DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/nelsonlaidev'
  UPSTASH_REDIS_REST_URL: 'http://localhost:8079'
  UPSTASH_REDIS_REST_TOKEN: 'nelsonlaidev'
  IP_ADDRESS_SALT: 'ci-ip-address-salt'
  BETTER_AUTH_SECRET: 'ci-better-auth-secret-for-testing-purposes'
  GITHUB_CLIENT_ID: 'ci-github-client-id'
  GITHUB_CLIENT_SECRET: 'ci-github-client-secret'

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test:unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Run Oxlint
        run: pnpm lint

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Run cspell
        run: pnpm lint:spell

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Run type check
        run: pnpm typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Run Oxfmt format check
        run: pnpm format:check

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Run Knip
        run: pnpm knip

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Run i18n check
        run: pnpm check:i18n

  e2e:
    name: End-to-end Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure environment
        uses: ./.github/actions/setup

      - name: Install Playwright with dependencies
        run: pnpm playwright install --with-deps chromium --only-shell

      - name: Build apps
        run: pnpm build

      - name: Run services
        run: docker compose up -d

      - name: Verify Postgres is ready
        run: |
          until docker exec $(docker ps -qf "name=nelsonlaidev-postgres") pg_isready; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
